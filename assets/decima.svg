<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="Decima: duplicate photo dissolving">
<style>
  .ghost { fill: #1F2328; opacity: .06; }
  .ink { fill: #1F2328; }
  .soft { fill: #59636E; }
  .panel { fill: #F3F5F8; }
  .line { stroke: #1F2328; }
  @media (prefers-color-scheme: dark) {
    .ghost { fill: #F0F6FC; opacity: .07; }
    .ink { fill: #F0F6FC; }
    .soft { fill: #9198A1; }
    .panel { fill: #161B22; }
    .line { stroke: #F0F6FC; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }

  .gone { animation: gone 4s ease-in infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes gone { 0%,35% { opacity: 1; transform: scale(1); } 50% { opacity: 0; transform: scale(.85); }
                    88% { opacity: 0; transform: scale(.85); } 100% { opacity: 1; transform: scale(1); } }
  .dust { opacity: 0; animation: dust 4s ease-out infinite; }
  @keyframes dust { 0%,36% { opacity: 0; transform: translate(0,0); } 40% { opacity: 1; }
                    70%,100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  .ring { animation: ring 4s ease infinite; }
  @keyframes ring { 0%,10% { opacity: 0; } 20%,60% { opacity: 1; } 75%,100% { opacity: 0; } }
</style>
